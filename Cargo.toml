[package]
name = "pushover-unifi-hotspot"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8.9"
axum-client-ip = "1.3.1"
axum-extra = { version = "0.12.6", features = ["routing"] }
reqwest = { version = "0.13.5", features = ["form", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
