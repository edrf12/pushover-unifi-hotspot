<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Waiting for approval · Guest Wi-Fi</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18332d;background:#f4f7f3;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:460px;background:white;border:1px solid #dde7de;border-radius:24px;padding:48px 32px;box-shadow:0 20px 65px #173d2910}small{font-size:12px;letter-spacing:.16em;font-weight:700;color:#64756a}h1{font-size:32px;line-height:1.2;letter-spacing:-.04em;margin:24px 0 16px}p{color:#617168;line-height:1.7;margin:0}.icon{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#eaf4ed;color:#287346;margin:32px 0;font-size:26px}.foot{border-top:1px solid #e6ece7;margin-top:32px;padding-top:20px;font-size:13px}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
@media(prefers-color-scheme:dark){
  :root{color-scheme:dark;color:#e2eee7;background:#101813}
  main{background:#19251e;border-color:#34483b;box-shadow:0 20px 65px #00000040}
  small{color:#a9beb0}
  p{color:#b5c7bb}
  .icon{background:#263e2e;color:#8cdda6}
  .foot{border-color:#34483b}
}
</style></head><body><main><small>GUEST WI-FI</small><div class="icon pulse" aria-hidden="true">⋯</div><section aria-live="polite"><h1 id="title">Waiting for approval</h1><p id="message">Your access request has been sent. Keep this page open while your host approves your connection.</p></section><p class="foot">This page will update automatically.</p><noscript><p>Enable JavaScript to see when your connection is approved.</p></noscript></main>
<script>
const session = new URLSearchParams(location.search).get('session');
const title = document.getElementById('title');
const message = document.getElementById('message');
function stop(text) { title.textContent = 'Request expired'; message.textContent = text; document.querySelector('.icon').classList.remove('pulse'); document.querySelector('.foot').textContent = 'You can close this page.'; }
const mac = new URLSearchParams(location.search).get('id');
if (session && mac) {
  const events = new EventSource('/guest/events?' + new URLSearchParams({session, id: mac}));
  events.addEventListener('waiting', () => {
    message.textContent = 'Your access request has been sent. Keep this page open while your host approves your connection.';
  });
  events.addEventListener('authorized', () => { events.close(); location.replace('/authorized'); });
  events.addEventListener('expired', () => { events.close(); stop('Please reconnect to the guest Wi-Fi to request access again.'); });
  events.addEventListener('failed', () => { events.close(); stop('Your request could not be sent. Please reconnect to the guest Wi-Fi to try again.'); title.textContent = 'Request unsuccessful'; });
  events.onerror = () => { message.textContent = 'Reconnecting to the portal. Your approval will appear here when the connection returns.'; };
  window.addEventListener('pagehide', () => events.close());
  // A cached page retains the closed stream; reload to recover the current approval state.
  window.addEventListener('pageshow', event => { if (event.persisted) location.reload(); });
}
else { title.textContent = 'Welcome to guest Wi-Fi'; message.textContent = 'Connect to the guest Wi-Fi and open its sign-in page to request access.'; document.querySelector('.icon').classList.remove('pulse'); document.querySelector('.foot').textContent = 'Your host will approve your connection.'; }
</script></body></html>
